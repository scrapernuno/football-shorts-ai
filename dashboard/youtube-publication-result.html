<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Publication Result</title>
  <style>
    :root{color-scheme:dark;background:#071019;color:#e8f0f7;font-family:Inter,system-ui,sans-serif}
    body{margin:0;padding:24px;max-width:1120px;margin-inline:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.badge{padding:8px 12px;border:1px solid #35506a;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}.card{background:#0d1924;border:1px solid #24394c;border-radius:12px;padding:16px}.value{font-size:1.2rem;font-weight:700;word-break:break-word}.player{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#02060a}.blocked{padding:38px;text-align:center;border:1px dashed #5d3640;border-radius:12px;background:#1a0d12}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}a{color:#8bc8ff}button{background:#162b3c;color:#fff;border:1px solid #365b76;border-radius:8px;padding:10px 14px;cursor:pointer}ul{margin:8px 0 0;padding-left:20px}
  </style>
</head>
<body>
  <header class="top"><div><h1>Publication Result</h1><p>Confirmação auditável da visibilidade final no YouTube.</p></div><span id="state" class="badge">loading</span></header>
  <main>
    <section id="media" class="card"></section>
    <section class="grid">
      <article class="card"><small>Vídeo</small><div id="videoId" class="value">—</div></article>
      <article class="card"><small>Visibilidade anterior</small><div id="previous" class="value">—</div></article>
      <article class="card"><small>Visibilidade verificada</small><div id="verified" class="value">—</div></article>
      <article class="card"><small>Execução</small><div id="execution" class="value">—</div></article>
    </section>
    <section class="card" style="margin-top:14px"><small>Bloqueadores</small><ul id="blockers"></ul></section>
    <div class="actions"><a id="openYouTube" href="#" hidden target="_blank" rel="noopener">Abrir no YouTube</a><button id="reload" type="button">Atualizar</button></div>
  </main>
  <script src="assets/youtube-publication-result.js"></script>
</body>
</html>

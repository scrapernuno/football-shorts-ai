<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thumbnail Preview Studio</title>
  <link rel="stylesheet" href="assets/video-preview.css">
  <style>
    .thumbnail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
    .thumbnail-card{background:#111827;border:1px solid #263247;border-radius:16px;overflow:hidden;text-align:left;color:inherit;padding:0;cursor:pointer}
    .thumbnail-card.selected{outline:2px solid #60a5fa}
    .thumbnail-stage{position:relative;aspect-ratio:16/9;background:#030712;overflow:hidden}
    .thumbnail-stage img{width:100%;height:100%;object-fit:cover;display:block}
    .thumbnail-copy{position:absolute;inset:auto 5% 8% 5%;text-shadow:0 3px 12px #000}
    .thumbnail-copy strong{display:block;font-size:clamp(1.3rem,4vw,2.7rem);line-height:.9;text-transform:uppercase}
    .thumbnail-copy span{display:block;margin-top:.45rem;font-weight:700}
    .thumbnail-meta{padding:1rem;display:grid;gap:.35rem}
  </style>
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">FOOTBALL SHORTS AI · 0060H</p><h1>Thumbnail Preview Studio</h1></div>
    <a href="index.html">← Dashboard</a>
  </header>
  <main>
    <section class="status-grid">
      <article><span>Estado</span><strong id="compositionState">NOT_LOADED</strong></article>
      <article><span>Candidatos</span><strong id="candidateCount">0</strong></article>
      <article><span>Selecionado</span><strong id="selectedCandidate">—</strong></article>
      <article><span>Publicação</span><strong>DISABLED</strong></article>
    </section>
    <section class="panel">
      <div class="panel-head">
        <div><p class="eyebrow">COMPOSIÇÕES</p><h2>Comparação de thumbnails</h2></div>
        <button id="importButton" type="button">Importar JSON</button>
        <input id="fileInput" type="file" accept="application/json" hidden>
      </div>
      <div id="thumbnailGrid" class="thumbnail-grid"></div>
      <p id="message" class="message">Apenas imagens próprias ou licenciadas podem ser pré-visualizadas.</p>
    </section>
  </main>
  <script src="assets/thumbnail-preview.js"></script>
</body>
</html>

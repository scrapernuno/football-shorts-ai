name: Production Brain Functional Pipeline

on:
  push:
    paths:
      - "src/production_brain/**"
      - "src/engines/**"
      - "src/knowledge/**"
      - "src/video/**"
      - "src/dashboard/certify_video_library.py"
      - "src/dashboard/certify_video_player.py"
      - "src/dashboard/certify_video_actions.py"
      - "src/dashboard/certify_video_dashboard.py"
      - "dashboard/data/video_library.json"
      - "dashboard/videos.html"
      - "dashboard/assets/video-library.css"
      - "dashboard/assets/video-library.js"
      - "docs/FOOTBALL-SHORTS-AI-0044F-VIDEO-DASHBOARD-FINAL-CERTIFICATION.md"
      - "docs/FOOTBALL-SHORTS-AI-0045A-VIDEO-RENDERING-READINESS-AUDIT.md"
      - "tests/production_brain/test_functional_pipeline.py"
      - "tests/knowledge/**"
      - "tests/video/**"
      - "tests/dashboard/test_video_library.py"
      - "tests/dashboard/test_video_actions.py"
      - ".github/workflows/production-brain-functional-pipeline.yml"
  pull_request:
    paths:
      - "src/production_brain/**"
      - "src/engines/**"
      - "src/knowledge/**"
      - "src/video/**"
      - "src/dashboard/certify_video_library.py"
      - "src/dashboard/certify_video_player.py"
      - "src/dashboard/certify_video_actions.py"
      - "src/dashboard/certify_video_dashboard.py"
      - "dashboard/data/video_library.json"
      - "dashboard/videos.html"
      - "dashboard/assets/video-library.css"
      - "dashboard/assets/video-library.js"
      - "docs/FOOTBALL-SHORTS-AI-0044F-VIDEO-DASHBOARD-FINAL-CERTIFICATION.md"
      - "docs/FOOTBALL-SHORTS-AI-0045A-VIDEO-RENDERING-READINESS-AUDIT.md"
      - "tests/production_brain/test_functional_pipeline.py"
      - "tests/knowledge/**"
      - "tests/video/**"
      - "tests/dashboard/test_video_library.py"
      - "tests/dashboard/test_video_actions.py"
      - ".github/workflows/production-brain-functional-pipeline.yml"
  workflow_dispatch:

jobs:
  certify-functional-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Configure PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> "$GITHUB_ENV"

      - name: Compile functional pipeline and governed contracts
        run: |
          python -m py_compile \
            src/production_brain/brain.py \
            src/production_brain/certify_functional_pipeline.py \
            src/production_brain/certify_live_knowledge_pipeline.py \
            src/production_brain/certify_multi_provider_knowledge_pipeline.py \
            src/engines/research_engine.py \
            src/engines/story_engine.py \
            src/engines/production_engine.py \
            src/engines/publishing_engine.py \
            src/knowledge/contracts.py \
            src/knowledge/adapters.py \
            src/knowledge/fixtures.py \
            src/knowledge/live_provider.py \
            src/knowledge/runtime.py \
            src/knowledge/orchestration.py \
            src/knowledge/deduplication.py \
            src/knowledge/policy.py \
            src/video/contracts.py \
            src/video/rendering.py \
            src/video/ffmpeg_runtime.py \
            src/video/library_promotion.py \
            src/video/audit_rendering_readiness.py \
            src/video/audit_production_activation.py \
            src/video/render_production_video.py \
            src/video/certify_render_outputs.py \
            src/video/certify_library_promotion.py \
            src/video/certify_rendering_pipeline.py \
            src/dashboard/certify_video_library.py \
            src/dashboard/certify_video_player.py \
            src/dashboard/certify_video_actions.py \
            src/dashboard/certify_video_dashboard.py \
            tests/knowledge/test_live_provider.py \
            tests/knowledge/test_runtime_selection.py \
            tests/knowledge/test_multi_provider_orchestration.py \
            tests/knowledge/test_evidence_deduplication.py \
            tests/knowledge/test_confidence_conflict_policy.py \
            tests/knowledge/test_research_multi_provider_integration.py \
            tests/video/test_video_asset_contract.py \
            tests/video/test_rendering_contract.py \
            tests/video/test_ffmpeg_runtime.py \
            tests/video/test_render_outputs_certification.py \
            tests/video/test_library_promotion.py \
            tests/video/test_rendering_pipeline_certification.py \
            tests/video/test_production_activation_readiness.py \
            tests/video/test_production_render_command.py \
            tests/dashboard/test_video_library.py \
            tests/dashboard/test_video_actions.py

      - name: Run functional pipeline and governed contract tests
        run: |
          pytest -q \
            tests/production_brain/test_functional_pipeline.py \
            tests/knowledge/test_live_provider.py \
            tests/knowledge/test_runtime_selection.py \
            tests/knowledge/test_multi_provider_orchestration.py \
            tests/knowledge/test_evidence_deduplication.py \
            tests/knowledge/test_confidence_conflict_policy.py \
            tests/knowledge/test_research_multi_provider_integration.py \
            tests/video/test_video_asset_contract.py \
            tests/video/test_rendering_contract.py \
            tests/video/test_ffmpeg_runtime.py \
            tests/video/test_render_outputs_certification.py \
            tests/video/test_library_promotion.py \
            tests/video/test_rendering_pipeline_certification.py \
            tests/video/test_production_activation_readiness.py \
            tests/video/test_production_render_command.py \
            tests/dashboard/test_video_library.py \
            tests/dashboard/test_video_actions.py

      - name: Certify offline governed research evidence
        run: python -m production_brain.certify_functional_pipeline

      - name: Certify controlled live knowledge pipeline
        run: python -m production_brain.certify_live_knowledge_pipeline

      - name: Certify governed multi-provider knowledge pipeline
        run: python -m production_brain.certify_multi_provider_knowledge_pipeline

      - name: Certify governed dashboard video library
        run: python -m dashboard.certify_video_library

      - name: Certify governed dashboard video player
        run: python -m dashboard.certify_video_player

      - name: Certify governed video actions
        run: python -m dashboard.certify_video_actions

      - name: Certify complete governed video dashboard
        run: python -m dashboard.certify_video_dashboard

      - name: Audit governed video rendering readiness
        run: python -m video.audit_rendering_readiness

      - name: Certify governed subtitle and thumbnail outputs
        run: python -m video.certify_render_outputs

      - name: Certify atomic video library promotion
        run: python -m video.certify_library_promotion

      - name: Certify final governed rendering pipeline
        run: python -m video.certify_rendering_pipeline

      - name: Generate controlled production packages for activation audit
        run: python -m production_brain.brain

      - name: Audit controlled production rendering activation readiness
        run: python -m video.audit_production_activation

      - name: Plan controlled production video render
        run: python -m video.render_production_video

name: YouTube Discovery Live Certification

on:
  workflow_dispatch:
    inputs:
      query:
        description: Football search query
        required: true
        default: Champions League goals
        type: string
      max_results:
        description: Maximum metadata results
        required: true
        default: "12"
        type: choice
        options: ["5", "10", "12", "20", "25", "50"]
      minimum_assets:
        description: Minimum YouTube assets required for certification
        required: true
        default: "1"
        type: choice
        options: ["1", "3", "5", "10"]
      commit_dashboard:
        description: Commit the certified library to main
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONPATH: src
  DASHBOARD_PATH: dashboard/data/football_library.json
  SYNC_REPORT_PATH: artifacts/youtube-discovery-sync-report.json
  LOCAL_CERTIFICATION_PATH: artifacts/youtube-live-local-certification.json
  LIVE_CERTIFICATION_PATH: artifacts/youtube-live-publication-certification.json

concurrency:
  group: youtube-discovery-live-certification
  cancel-in-progress: false

jobs:
  activate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: youtube-discovery
    env:
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest
          python --version
          python -m pip --version
          python -m pytest --version

      - name: Validate governed activation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${YOUTUBE_DATA_API_KEY:-}" || {
            echo "Required secret YOUTUBE_DATA_API_KEY is unavailable." >&2
            exit 1
          }
          [[ "${{ inputs.max_results }}" =~ ^[0-9]+$ ]]
          [[ "${{ inputs.minimum_assets }}" =~ ^[0-9]+$ ]]
          test "${{ inputs.max_results }}" -ge "${{ inputs.minimum_assets }}"
          test "${{ inputs.max_results }}" -le 50

      - name: Run focused 0055A-0055E tests
        run: |
          python -m pytest -q \
            tests/discovery/test_youtube_discovery_provider.py \
            tests/discovery/test_youtube_data_api_http_client.py \
            tests/discovery/test_environment_secret_resolver.py \
            tests/discovery/test_execute_youtube_discovery_sync.py \
            tests/discovery/test_certify_live_youtube_dashboard.py

      - name: Execute live metadata discovery
        run: |
          python src/discovery/run_youtube_discovery_sync.py \
            --activate \
            --query "${{ inputs.query }}" \
            --max-results "${{ inputs.max_results }}" \
            --region-code PT \
            --language pt \
            --video-duration short \
            --safe-search moderate \
            --dashboard-path "$DASHBOARD_PATH" \
            --report-path "$SYNC_REPORT_PATH"

      - name: Certify local synchronized library
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from discovery.certify_live_youtube_dashboard import certify_live_youtube_dashboard

          result = certify_live_youtube_dashboard(
              library_path=Path("dashboard/data/football_library.json"),
              minimum_assets=int("${{ inputs.minimum_assets }}"),
          )
          assert result.status == "LOCAL_CERTIFIED"
          destination = Path("artifacts/youtube-live-local-certification.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(
              json.dumps(result.to_dict(), ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(result.status)
          print(f"YOUTUBE_ASSETS={result.youtube_asset_count}")
          print(f"LIBRARY_SHA256={result.library_sha256}")
          PY

      - name: Prepare GitHub Pages artifact
        run: |
          set -euo pipefail
          touch dashboard/.nojekyll
          test -s dashboard/discovery.html
          test -s dashboard/data/football_library.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Upload pre-deploy evidence
        uses: actions/upload-artifact@v4
        with:
          name: youtube-live-predeploy-${{ github.run_id }}
          path: |
            dashboard/data/football_library.json
            artifacts/youtube-discovery-sync-report.json
            artifacts/youtube-live-local-certification.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit certified dashboard library
        if: ${{ inputs.commit_dashboard }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$DASHBOARD_PATH"; then
            echo "No dashboard library changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DASHBOARD_PATH"
          git commit -m "Publish certified YouTube discovery library"
          git push origin HEAD:main

  deploy-pages:
    needs: activate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-publication:
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout certified source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pre-deploy evidence
        uses: actions/download-artifact@v4
        with:
          name: youtube-live-predeploy-${{ github.run_id }}
          path: .

      - name: Wait for public library
        shell: bash
        env:
          PUBLIC_LIBRARY_URL: ${{ needs.deploy-pages.outputs.page_url }}data/football_library.json
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              "$PUBLIC_LIBRARY_URL" \
              -o artifacts/public-football-library.json; then
              exit 0
            fi
            sleep 10
          done
          echo "Public Football Library did not become available." >&2
          exit 1

      - name: Certify public Dashboard publication
        env:
          PUBLIC_LIBRARY_URL: ${{ needs.deploy-pages.outputs.page_url }}data/football_library.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from discovery.certify_live_youtube_dashboard import certify_live_youtube_dashboard

          result = certify_live_youtube_dashboard(
              library_path=Path("dashboard/data/football_library.json"),
              public_library_url=os.environ["PUBLIC_LIBRARY_URL"],
              minimum_assets=int("${{ inputs.minimum_assets }}"),
          )
          assert result.status == "LIVE_CERTIFIED"
          destination = Path("artifacts/youtube-live-publication-certification.json")
          destination.write_text(
              json.dumps(result.to_dict(), ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print("LIVE_CERTIFIED")
          print(f"YOUTUBE_ASSETS={result.youtube_asset_count}")
          print(f"PUBLIC_LIBRARY_SHA256={result.public_library_sha256}")
          PY

      - name: Upload final live certification
        uses: actions/upload-artifact@v4
        with:
          name: youtube-live-certification-${{ github.run_id }}
          path: |
            dashboard/data/football_library.json
            artifacts/public-football-library.json
            artifacts/youtube-discovery-sync-report.json
            artifacts/youtube-live-local-certification.json
            artifacts/youtube-live-publication-certification.json
          if-no-files-found: error
          retention-days: 30

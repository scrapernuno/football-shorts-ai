name: AI Director Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/director/**'
      - 'tests/director/**'
      - 'tests/dashboard/test_ai_director_*.py'
      - 'dashboard/ai-director-review.html'
      - 'dashboard/assets/ai-director-review.*'
      - 'dashboard/assets/dashboard-ai-director-integration.js'
      - 'dashboard/data/ai_director_review_package.json'
      - '.github/workflows/ai-director-certification.yml'
  pull_request:
    paths:
      - 'src/director/**'
      - 'tests/director/**'
      - 'tests/dashboard/test_ai_director_*.py'
      - 'dashboard/ai-director-review.html'
      - 'dashboard/assets/ai-director-review.*'
      - 'dashboard/assets/dashboard-ai-director-integration.js'
      - 'dashboard/data/ai_director_review_package.json'

permissions:
  contents: read

jobs:
  certify-ai-director:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Compile AI Director sources
        run: python -m compileall -q src/director tests/director

      - name: Run AI Director and Dashboard tests
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pytest -q tests/director tests/dashboard/test_ai_director_review_studio.py tests/dashboard/test_ai_director_dashboard_live_integration.py

      - name: Run 0058I final certification
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          mkdir -p certification-evidence
          python src/director/certify_ai_director.py | tee certification-evidence/ai-director-0058I.txt
          grep -Fx 'CERTIFIED' certification-evidence/ai-director-0058I.txt
          grep -Fx 'NETWORK_ENABLED=DISABLED' certification-evidence/ai-director-0058I.txt
          grep -Fx 'ACQUISITION_ENABLED=DISABLED' certification-evidence/ai-director-0058I.txt
          grep -Fx 'MODEL_TRAINING_ENABLED=DISABLED' certification-evidence/ai-director-0058I.txt
          grep -Fx 'EXTRACTION_ENABLED=DISABLED' certification-evidence/ai-director-0058I.txt
          grep -Fx 'RENDER_ENABLED=DISABLED' certification-evidence/ai-director-0058I.txt
          grep -Fx 'AUTO_PUBLISH=DISABLED' certification-evidence/ai-director-0058I.txt

      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: football-shorts-ai-0058I-certification
          path: certification-evidence/ai-director-0058I.txt
          if-no-files-found: error
          retention-days: 30

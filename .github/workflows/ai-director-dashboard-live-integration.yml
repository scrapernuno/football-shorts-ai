name: AI Director Dashboard Live Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/director/**"
      - "dashboard/ai-director-review.html"
      - "dashboard/assets/ai-director-review.*"
      - "dashboard/assets/dashboard-ai-director-integration.js"
      - "dashboard/data/ai_director_review_package.json"
      - "tests/dashboard/test_ai_director_dashboard_live_integration.py"
      - ".github/workflows/ai-director-dashboard-live-integration.yml"

permissions:
  contents: write

concurrency:
  group: ai-director-dashboard-live-integration
  cancel-in-progress: false

jobs:
  integrate-and-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Install main dashboard entrypoint
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("dashboard/index.html")
          source = path.read_text(encoding="utf-8")
          marker = '    <script src="assets/dashboard-editorial-integration.js"></script>'
          entry = '    <script src="assets/dashboard-ai-director-integration.js"></script>'
          if entry not in source:
              if marker not in source:
                  raise SystemExit("dashboard script insertion marker missing")
              source = source.replace(marker, marker + "\n" + entry, 1)
              path.write_text(source, encoding="utf-8")
          PY

      - name: Generate fail-closed public package
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python src/director/export_ai_director_review_package.py \
            --output dashboard/data/ai_director_review_package.json

      - name: Compile 0058H
        run: python -m compileall -q src/director tests/dashboard

      - name: Run focused certification
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/dashboard/test_ai_director_dashboard_live_integration.py

      - name: Verify static integration
        run: |
          set -euo pipefail
          grep -F 'assets/dashboard-ai-director-integration.js' dashboard/index.html
          grep -F 'ai-director-review.html' dashboard/assets/dashboard-ai-director-integration.js
          grep -F 'AI_DIRECTOR_EVIDENCE_MISSING' dashboard/data/ai_director_review_package.json

      - name: Commit generated integration
        run: |
          set -euo pipefail
          if git diff --quiet -- dashboard/index.html dashboard/data/ai_director_review_package.json; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html dashboard/data/ai_director_review_package.json
          git commit -m "chore(0058H): publish AI Director dashboard integration"
          git push

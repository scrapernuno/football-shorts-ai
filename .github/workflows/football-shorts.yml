          required_analytics = {
              "analytics_version",
              "generated_at",
              "content_id",
              "platform",
              "status",
              "metrics",
              "growth_signals",
              "recommendation",
          }


          missing_analytics = (
              required_analytics
              - analytics.keys()
          )



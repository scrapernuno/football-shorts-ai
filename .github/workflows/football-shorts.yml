name: Football Shorts AI Pipeline


on:

  workflow_dispatch:


permissions:

  contents: read



jobs:

  football-shorts:


    name: Football Shorts AI Pipeline


    runs-on: ubuntu-latest


    timeout-minutes: 25



    env:


      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      OPENAI_MODEL: gpt-5.5

      OPENAI_TIMEOUT_SECONDS: "120"

      OPENAI_MAX_RETRIES: "3"

      OPENAI_MAX_OUTPUT_TOKENS: "7000"

      PYTHONUNBUFFERED: "1"



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      - name: Compile project

        run: |

          python -m compileall src



      - name: Validate Editorial Parser

        run: |

          PYTHONPATH=src python src/editorial/test_parser.py



      - name: Validate OpenAI Secret

        run: |

          if [ -z "${OPENAI_API_KEY}" ]; then

            echo "::error::OPENAI_API_KEY não configurada."

            exit 1

          fi


          echo "OPENAI_API_KEY configurada"



      - name: Generate News Digest

        run: |

          python src/generate_digest.py



      - name: Generate Editorial Package

        run: |

          PYTHONPATH=src python src/editorial/generate_package.py



      - name: Build Dashboard Model

        run: |

          PYTHONPATH=src python src/production/build_dashboard_model.py



      - name: Sync Dashboard Data

        run: |

          PYTHONPATH=src python src/dashboard/sync_dashboard.py



      - name: Build Content Production Package

        run: |

          PYTHONPATH=src python src/production/build_content_package.py



      - name: Generate HTML

        run: |

          python src/render_email.py



      - name: Validate Generated Outputs

        run: |

          python - <<'PY'

          import json

          from pathlib import Path



          files = [

              "output/digest.json",

              "output/editorial_package.json",

              "output/dashboard_model.json",

              "output/content_package.json",

              "output/digest.html",

          ]



          for file in files:

              if not Path(file).exists():

                  raise SystemExit(
                      f"Ficheiro em falta: {file}"
                  )



          digest = json.loads(

              Path("output/digest.json")

              .read_text(
                  encoding="utf-8"
              )

          )



          editorial = json.loads(

              Path("output/editorial_package.json")

              .read_text(
                  encoding="utf-8"
              )

          )



          dashboard = json.loads(

              Path("output/dashboard_model.json")

              .read_text(
                  encoding="utf-8"
              )

          )



          content = json.loads(

              Path("output/content_package.json")

              .read_text(
                  encoding="utf-8"
              )

          )



          if len(digest.get("topics", [])) != 5:

              raise SystemExit(
                  "Digest inválido"
              )



          if len(editorial.get("topics", [])) != 5:

              raise SystemExit(
                  "Editorial package inválido"
              )



          required_dashboard = {

              "generated_at",

              "channel",

              "top_title",

              "top_hook",

              "viral_probability",

              "metrics",

              "hooks",

              "storyboard",

              "ranking",

          }



          missing_dashboard = (

              required_dashboard

              -

              dashboard.keys()

          )



          if missing_dashboard:

              raise SystemExit(

                  f"Dashboard incompleta: {missing_dashboard}"

              )



          required_content = {

              "package_version",

              "generated_at",

              "source_topic",

              "script",

              "voiceover",

              "scenes",

              "captions",

              "assets",

              "publishing",

          }



          missing_content = (

              required_content

              -

              content.keys()

          )



          if missing_content:

              raise SystemExit(

                  f"Content package incompleto: {missing_content}"

              )



          if content["source_topic"]["priority"] != 1:

              raise SystemExit(

                  "Content package não usa winner priority 1"

              )



          print("=" * 70)

          print("PIPELINE VALIDATION PASS")

          print("=" * 70)

          print(

              f"Digest topics: {len(digest['topics'])}"

          )

          print(

              f"Editorial topics: {len(editorial['topics'])}"

          )

          print(

              f"Dashboard ranking: {len(dashboard['ranking'])}"

          )

          print(

              f"Production scenes: {len(content['scenes'])}"

          )

          print(

              f"Winner: {content['source_topic']['title']}"

          )



          PY



      - name: Upload Artifacts

        if: always()


        uses: actions/upload-artifact@v4


        with:


          name: football-shorts-ai-output


          retention-days: 7


          path: |


            output/

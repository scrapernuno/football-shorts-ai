name: Football Shorts AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  football-shorts:
    name: Football Shorts AI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.5
      OPENAI_TIMEOUT_SECONDS: "120"
      OPENAI_MAX_RETRIES: "3"
      OPENAI_MAX_OUTPUT_TOKENS: "7000"
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Compile Python project
        run: |
          python -m compileall src


      - name: Validate Editorial Package Contract
        run: |
          PYTHONPATH=src python src/editorial/test_parser.py


      - name: Validate OpenAI Secret
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY não configurada."
            exit 1
          fi

          echo "OPENAI_API_KEY configurada."


      - name: Generate Digest
        run: |
          python src/generate_digest.py


      - name: Generate HTML Email
        run: |
          python src/render_email.py


      - name: Build Dashboard Model
        run: |
          PYTHONPATH=src python src/production/build_dashboard_model.py


      - name: Validate Outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required_files = [
              "output/digest.json",
              "output/digest.html",
              "output/last_prompt.txt",
              "output/dashboard_model.json",
          ]

          for file in required_files:
              path = Path(file)

              if not path.exists():
                  raise SystemExit(
                      f"Ficheiro em falta: {file}"
                  )

          digest = json.loads(
              Path(
                  "output/digest.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          dashboard = json.loads(
              Path(
                  "output/dashboard_model.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          topics = digest.get("topics")

          if not isinstance(topics, list):
              raise SystemExit(
                  "digest.json inválido: topics"
              )

          if len(topics) != 5:
              raise SystemExit(
                  f"Esperados 5 temas, encontrados {len(topics)}"
              )

          dashboard_required = {
              "generated_at",
              "channel",
              "top_title",
              "top_hook",
              "viral_probability",
              "predicted_ctr",
              "predicted_retention",
              "recommended_publish_time",
              "metrics",
              "hooks",
              "storyboard",
              "ranking",
          }

          missing = (
              dashboard_required
              -
              dashboard.keys()
          )

          if missing:
              raise SystemExit(
                  f"dashboard_model.json sem campos: {missing}"
              )

          if len(dashboard["hooks"]) != 3:
              raise SystemExit(
                  "Dashboard deve conter 3 hooks."
              )

          if len(dashboard["ranking"]) != 5:
              raise SystemExit(
                  "Dashboard deve conter ranking de 5 temas."
              )

          print("=" * 70)
          print("PIPELINE VALIDATION PASS")
          print("=" * 70)
          print(
              f"Digest topics: {len(topics)}"
          )
          print(
              f"Dashboard title: {dashboard['top_title']}"
          )
          print(
              f"Hooks: {len(dashboard['hooks'])}"
          )
          print(
              f"Scenes: {len(dashboard['storyboard'])}"
          )
          print(
              f"Ranking: {len(dashboard['ranking'])}"
          )
          PY


      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-shorts-ai-output
          retention-days: 7
          path: |
            output/

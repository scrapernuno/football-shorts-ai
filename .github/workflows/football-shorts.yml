          missing_public_analytics = (
              required_analytics
              - analytics_public.keys()
          )


          if missing_public_analytics:
              raise SystemExit(
                  "Analytics package público incompleto: "
                  f"{sorted(missing_public_analytics)}"
              )


          if analytics["status"] != "pending":
              raise SystemExit(
                  "Analytics inicial deve "
                  "estar pending"
              )


          if (
              analytics.get("content_id")
              != publishing.get("source_content_id")
          ):
              raise SystemExit(
                  "Analytics content_id não corresponde "
                  "ao Publishing source_content_id"
              )


          if (
              analytics_public.get("content_id")
              != analytics.get("content_id")
          ):
              raise SystemExit(
                  "Analytics package público não corresponde "
                  "ao package produzido"
              )


          metrics = analytics.get(
              "metrics"
          )


          required_metrics = {
              "views",
              "likes",
              "comments",
              "shares",
              "average_watch_time_seconds",
              "retention_percent",
              "subscribers_gained",
          }


          if not isinstance(metrics, dict):
              raise SystemExit(
                  "Analytics metrics inválido"
              )


          missing_metrics = (
              required_metrics
              - metrics.keys()
          )


          if missing_metrics:
              raise SystemExit(
                  "Analytics metrics incompleto: "

name: Football Shorts AI Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  football-shorts:
    name: Football Shorts AI Pipeline

    runs-on: ubuntu-latest

    timeout-minutes: 25

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.5
      OPENAI_TIMEOUT_SECONDS: "120"
      OPENAI_MAX_RETRIES: "3"
      OPENAI_MAX_OUTPUT_TOKENS: "7000"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile project
        run: |
          python -m compileall src

      - name: Validate Editorial Parser
        run: |
          PYTHONPATH=src \
          python src/editorial/test_parser.py

      - name: Validate OpenAI Secret
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY não configurada."
            exit 1
          fi

          echo "OPENAI_API_KEY configurada"

      - name: Generate News Digest
        run: |
          python src/generate_digest.py

      - name: Generate Editorial Package
        run: |
          PYTHONPATH=src \
          python src/editorial/generate_package.py

      - name: Build Dashboard Model
        run: |
          PYTHONPATH=src \
          python src/production/build_dashboard_model.py

      - name: Sync Dashboard Data
        run: |
          PYTHONPATH=src \
          python src/dashboard/sync_dashboard.py

      - name: Build Content Production Package
        run: |
          PYTHONPATH=src \
          python src/production/build_content_package.py

      - name: Build Publishing Package
        run: |
          PYTHONPATH=src \
          python src/publishing/build_publishing_package.py

      - name: Build Analytics Package
        run: |
          PYTHONPATH=src \
          python src/analytics/build_analytics_package.py

      - name: Compile Production Studio Synchronizer
        run: |
          python -m py_compile \
            src/dashboard/sync_production_studio.py

      - name: Sync Production Studio Data
        run: |
          PYTHONPATH=src \
          python src/dashboard/sync_production_studio.py

      - name: Generate HTML
        run: |
          python src/render_email.py

      - name: Prepare GitHub Pages
        run: |
          touch dashboard/.nojekyll

          echo "=============================================="
          echo "GITHUB PAGES CONTENT"
          echo "=============================================="

          find dashboard \
            -maxdepth 5 \
            -type f \
            -print \
            | sort

      - name: Validate Generated Outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path


          required_files = [
              "output/digest.json",
              "output/editorial_package.json",
              "output/dashboard_model.json",
              "output/content_package.json",
              "output/publishing_package.json",
              "output/analytics_package.json",
              "output/digest.html",

              "dashboard/index.html",
              "dashboard/assets/dashboard.css",
              "dashboard/assets/dashboard.js",
              "dashboard/.nojekyll",

              "dashboard/data/dashboard_model.json",
              "dashboard/data/content_package.json",
              "dashboard/data/publishing_package.json",
              "dashboard/data/analytics_package.json",
          ]


          allowed_empty_files = {
              "dashboard/.nojekyll",
          }


          for filename in required_files:
              path = Path(filename)

              if not path.is_file():
                  raise SystemExit(
                      f"Ficheiro em falta: {filename}"
                  )

              if (
                  path.stat().st_size <= 0
                  and filename not in allowed_empty_files
              ):
                  raise SystemExit(
                      f"Ficheiro vazio: {filename}"
                  )


          def load_json(filename: str) -> dict:
              path = Path(filename)

              try:
                  payload = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"JSON inválido em {filename}: {exc}"
                  ) from exc

              if not isinstance(payload, dict):
                  raise SystemExit(
                      f"{filename} deve conter um objeto JSON"
                  )

              return payload


          digest = load_json(
              "output/digest.json"
          )

          editorial = load_json(
              "output/editorial_package.json"
          )

          dashboard = load_json(
              "output/dashboard_model.json"
          )

          dashboard_public = load_json(
              "dashboard/data/dashboard_model.json"
          )

          content = load_json(
              "output/content_package.json"
          )

          content_public = load_json(
              "dashboard/data/content_package.json"
          )

          publishing = load_json(
              "output/publishing_package.json"
          )

          publishing_public = load_json(
              "dashboard/data/publishing_package.json"
          )

          analytics = load_json(
              "output/analytics_package.json"
          )

          analytics_public = load_json(
              "dashboard/data/analytics_package.json"
          )


          if len(digest.get("topics", [])) != 5:
              raise SystemExit(
                  "Digest inválido"
              )


          if len(editorial.get("topics", [])) != 5:
              raise SystemExit(
                  "Editorial package inválido"
              )


          required_dashboard = {
              "generated_at",
              "channel",
              "top_title",
              "top_hook",
              "viral_probability",
              "metrics",
              "hooks",
              "storyboard",
              "ranking",
          }


          missing_dashboard = (
              required_dashboard
              - dashboard.keys()
          )


          if missing_dashboard:
              raise SystemExit(
                  "Dashboard incompleta: "
                  f"{sorted(missing_dashboard)}"
              )


          missing_public_dashboard = (
              required_dashboard
              - dashboard_public.keys()
          )


          if missing_public_dashboard:
              raise SystemExit(
                  "Dashboard pública incompleta: "
                  f"{sorted(missing_public_dashboard)}"
              )


          if (
              dashboard_public.get("top_title")
              != dashboard.get("top_title")
          ):
              raise SystemExit(
                  "Dashboard pública não corresponde "
                  "ao modelo produzido"
              )


          ranking = dashboard.get(
              "ranking"
          )


          if not isinstance(ranking, list) or not ranking:
              raise SystemExit(
                  "Dashboard ranking inválido"
              )


          required_content = {
              "package_version",
              "generated_at",
              "source_topic",
              "script",
              "voiceover",
              "scenes",
              "captions",
              "assets",
              "publishing",
          }


          missing_content = (
              required_content
              - content.keys()
          )


          if missing_content:
              raise SystemExit(
                  "Content package incompleto: "
                  f"{sorted(missing_content)}"
              )


          missing_public_content = (
              required_content
              - content_public.keys()
          )


          if missing_public_content:
              raise SystemExit(
                  "Content package público incompleto: "
                  f"{sorted(missing_public_content)}"
              )


          source_topic = content.get(
              "source_topic"
          )


          if not isinstance(source_topic, dict):
              raise SystemExit(
                  "Content source_topic inválido"
              )


          if source_topic.get("priority") != 1:
              raise SystemExit(
                  "Content package não usa "
                  "winner priority 1"
              )


          public_source_topic = content_public.get(
              "source_topic"
          )


          if not isinstance(public_source_topic, dict):
              raise SystemExit(
                  "Content público source_topic inválido"
              )


          if (
              public_source_topic.get("title")
              != source_topic.get("title")
          ):
              raise SystemExit(
                  "Content package público não corresponde "
                  "ao package produzido"
              )


          script = content.get(
              "script"
          )


          if not isinstance(script, dict):
              raise SystemExit(
                  "Content script inválido"
              )


          required_script = {
              "hook",
              "introduction",
              "development",
              "climax",
              "ending",
              "call_to_action",
          }


          missing_script = (
              required_script
              - script.keys()
          )


          if missing_script:
              raise SystemExit(
                  "Content script incompleto: "
                  f"{sorted(missing_script)}"
              )


          scenes = content.get(
              "scenes"
          )


          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "Content package sem cenas"
              )


          expected_scene_numbers = list(
              range(
                  1,
                  len(scenes) + 1,
              )
          )


          observed_scene_numbers = [
              scene.get("scene_number")
              for scene in scenes
              if isinstance(scene, dict)
          ]


          if (
              observed_scene_numbers
              != expected_scene_numbers
          ):
              raise SystemExit(
                  "Content scenes não são sequenciais"
              )


          for index, scene in enumerate(scenes):
              if not isinstance(scene, dict):
                  raise SystemExit(
                      f"Scene inválida no índice {index}"
                  )

              duration = scene.get(
                  "duration_seconds"
              )

              if (
                  not isinstance(duration, int)
                  or isinstance(duration, bool)
                  or duration <= 0
              ):
                  raise SystemExit(
                      "Scene com duration_seconds inválido "
                      f"no índice {index}"
                  )


          required_publishing = {
              "package_version",
              "generated_at",
              "source_content_id",
              "metadata",
              "thumbnail",
              "checklist",
              "status",
          }


          missing_publishing = (
              required_publishing
              - publishing.keys()
          )


          if missing_publishing:
              raise SystemExit(
                  "Publishing package incompleto: "
                  f"{sorted(missing_publishing)}"
              )


          missing_public_publishing = (
              required_publishing
              - publishing_public.keys()
          )


          if missing_public_publishing:
              raise SystemExit(
                  "Publishing package público incompleto: "
                  f"{sorted(missing_public_publishing)}"
              )


          if publishing["status"] != "draft":
              raise SystemExit(
                  "Publishing package deve "
                  "iniciar em draft"
              )


          if (
              publishing_public.get("source_content_id")
              != publishing.get("source_content_id")
          ):
              raise SystemExit(
                  "Publishing package público não corresponde "
                  "ao package produzido"
              )


          metadata = publishing.get(
              "metadata"
          )


          if not isinstance(metadata, dict):
              raise SystemExit(
                  "Publishing metadata inválido"
              )


          if (
              metadata.get("title")
              != source_topic.get("title")
          ):
              raise SystemExit(
                  "Título do Publishing Package não corresponde "
                  "ao Content Package"
              )


          hashtags = metadata.get(
              "hashtags"
          )


          if not isinstance(hashtags, list) or not hashtags:
              raise SystemExit(
                  "Publishing hashtags inválidas"
              )


          if not isinstance(
              publishing.get("thumbnail"),
              dict,
          ):
              raise SystemExit(
                  "Publishing thumbnail inválido"
              )


          if not isinstance(
              publishing.get("checklist"),
              dict,
          ):
              raise SystemExit(
                  "Publishing checklist inválido"
              )


          required_analytics = {
              "analytics_version",
              "generated_at",
              "content_id",
              "platform",
              "status",
              "metrics",
              "growth_signals",
              "recommendation",
          }


          missing_analytics = (
              required_analytics
              - analytics.keys()
          )


          if missing_analytics:
              raise SystemExit(
                  "Analytics package incompleto: "
                  f"{sorted(missing_analytics)}"
              )


          missing_public_analytics = (
              required_analytics
              - analytics_public.keys()
          )


          if missing_public_analytics:
              raise SystemExit(
                  "Analytics package público incompleto: "
                  f"{sorted(missing_public_analytics)}"
              )


          if analytics["status"] != "pending":
              raise SystemExit(
                  "Analytics inicial deve "
                  "estar pending"
              )


          if (
              analytics.get("content_id")
              != publishing.get("source_content_id")
          ):
              raise SystemExit(
                  "Analytics content_id não corresponde "
                  "ao Publishing source_content_id"
              )


          if (
              analytics_public.get("content_id")
              != analytics.get("content_id")
          ):
              raise SystemExit(
                  "Analytics package público não corresponde "
                  "ao package produzido"
              )


          metrics = analytics.get(
              "metrics"
          )


          required_metrics = {
              "views",
              "likes",
              "comments",
              "shares",
              "average_watch_time_seconds",
              "retention_percent",
              "subscribers_gained",
          }


          if not isinstance(metrics, dict):
              raise SystemExit(
                  "Analytics metrics inválido"
              )


          missing_metrics = (
              required_metrics
              - metrics.keys()
          )


          if missing_metrics:
              raise SystemExit(
                  "Analytics metrics incompleto: "
                  f"{sorted(missing_metrics)}"
              )


          if not isinstance(
              analytics.get("growth_signals"),
              dict,
          ):
              raise SystemExit(
                  "Analytics growth_signals inválido"
              )


          if not isinstance(
              analytics.get("recommendation"),
              dict,
          ):
              raise SystemExit(
                  "Analytics recommendation inválida"
              )


          print("=" * 70)
          print("PIPELINE VALIDATION PASS")
          print("=" * 70)

          print(
              f"Digest topics: "
              f"{len(digest['topics'])}"
          )

          print(
              f"Editorial topics: "
              f"{len(editorial['topics'])}"
          )

          print(
              f"Dashboard ranking: "
              f"{len(ranking)}"
          )

          print(
              f"Production scenes: "
              f"{len(scenes)}"
          )

          print(
              f"Publishing status: "
              f"{publishing['status']}"
          )

          print(
              f"Analytics status: "
              f"{analytics['status']}"
          )

          print(
              f"Winner: "
              f"{source_topic['title']}"
          )

          print(
              "Production Studio data: PASS"
          )

          print(
              "GitHub Pages root: "
              "dashboard/index.html"
          )
          PY

      - name: Certify Production Studio Integration
        run: |
          python -m py_compile \
            src/dashboard/certify_production_studio.py

          PYTHONPATH=src \
          python src/dashboard/certify_production_studio.py

      - name: Close Production Studio Governance
        run: |
          python -m py_compile \
            src/dashboard/close_production_studio_governance.py

          PYTHONPATH=src \
          python src/dashboard/close_production_studio_governance.py

      - name: Validate Governance Closure Artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path


          governance_json = Path(
              "output/production_studio_governance_closure.json"
          )

          governance_document = Path(
              "docs/"
              "FOOTBALL-SHORTS-AI-0030C-"
              "PRODUCTION-STUDIO-INTERFACE-"
              "GOVERNANCE-CLOSURE.md"
          )


          for path in (
              governance_json,
              governance_document,
          ):
              if not path.is_file():
                  raise SystemExit(
                      f"Artefacto de fecho em falta: {path}"
                  )

              if path.stat().st_size <= 0:
                  raise SystemExit(
                      f"Artefacto de fecho vazio: {path}"
                  )


          try:
              payload = json.loads(
                  governance_json.read_text(
                      encoding="utf-8"
                  )
              )
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  f"Governance JSON inválido: {exc}"
              ) from exc


          if not isinstance(payload, dict):
              raise SystemExit(
                  "Governance JSON deve ser um objeto"
              )


          required_keys = {
              "closure_id",
              "closure_name",
              "closure_version",
              "closed_at",
              "status",
              "certification_status",
              "certification_authority",
              "scope",
              "governance_constraints",
              "certified_capabilities",
              "package_summary",
              "canonical_file_count",
              "canonical_manifest_sha256",
              "canonical_files",
              "decision",
          }


          missing = (
              required_keys
              - payload.keys()
          )


          if missing:
              raise SystemExit(
                  "Governance JSON incompleto: "
                  f"{sorted(missing)}"
              )


          if (
              payload.get("closure_id")
              != "FOOTBALL-SHORTS-AI-0030C"
          ):
              raise SystemExit(
                  "Closure ID inválido"
              )


          if payload.get("status") != "CLOSED":
              raise SystemExit(
                  "Governance status deve ser CLOSED"
              )


          if (
              payload.get("certification_status")
              != "CERTIFIED"
          ):
              raise SystemExit(
                  "Certification status deve ser CERTIFIED"
              )


          decision = payload.get(
              "decision"
          )


          if not isinstance(decision, dict):
              raise SystemExit(
                  "Governance decision inválida"
              )


          if (
              decision.get("production_studio_interface")
              != "ACCEPTED"
          ):
              raise SystemExit(
                  "Production Studio não foi aceite"
              )


          if decision.get("integration") != "CERTIFIED":
              raise SystemExit(
                  "Integration decision inválida"
              )


          if decision.get("governance") != "CLOSED":
              raise SystemExit(
                  "Governance decision não está fechada"
              )


          if (
              decision.get("next_phase_authorized")
              is not True
          ):
              raise SystemExit(
                  "A próxima fase não está autorizada"
              )


          canonical_files = payload.get(
              "canonical_files"
          )


          if not isinstance(canonical_files, list):
              raise SystemExit(
                  "Canonical files inválido"
              )


          if (
              payload.get("canonical_file_count")
              != len(canonical_files)
          ):
              raise SystemExit(
                  "Canonical file count inconsistente"
              )


          manifest_hash = payload.get(
              "canonical_manifest_sha256"
          )


          if (
              not isinstance(manifest_hash, str)
              or len(manifest_hash) != 64
          ):
              raise SystemExit(
                  "Canonical manifest SHA256 inválido"
              )


          document = governance_document.read_text(
              encoding="utf-8"
          )


          required_markers = [
              "Production Studio Interface Governance Closure",
              "**CLOSED**",
              "**CERTIFIED**",
              "IMPLEMENTATION: COMPLETE",
              "INTEGRATION: CERTIFIED",
              "GOVERNANCE: CLOSED",
              "STATUS: ACCEPTED",
          ]


          missing_markers = [
              marker
              for marker in required_markers
              if marker not in document
          ]


          if missing_markers:
              raise SystemExit(
                  "Documento de fecho incompleto: "
                  f"{missing_markers}"
              )


          print("=" * 70)
          print("GOVERNANCE CLOSURE VALIDATION PASS")
          print("=" * 70)

          print(
              f"Closure ID: "
              f"{payload['closure_id']}"
          )

          print(
              f"Status: "
              f"{payload['status']}"
          )

          print(
              f"Certification: "
              f"{payload['certification_status']}"
          )

          print(
              f"Canonical files: "
              f"{payload['canonical_file_count']}"
          )

          print(
              "Canonical manifest SHA256: "
              f"{payload['canonical_manifest_sha256']}"
          )

          print(
              "Next phase authorized: YES"
          )
          PY

      - name: Upload Pipeline Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-shorts-ai-output
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/
            dashboard/
            docs/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard/

  deploy-pages:
    name: Deploy GitHub Pages

    needs:
      - football-shorts

    if: ${{ needs.football-shorts.result == 'success' }}

    runs-on: ubuntu-latest

    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Football Shorts AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  football-shorts:
    name: Football Shorts AI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.5
      OPENAI_TIMEOUT_SECONDS: "120"
      OPENAI_MAX_RETRIES: "3"
      OPENAI_MAX_OUTPUT_TOKENS: "7000"
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Compile Python project
        run: |
          python -m compileall src


      - name: Validate editorial package contract
        run: |
          PYTHONPATH=src python src/editorial/test_parser.py


      - name: Validate OpenAI secret
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY não configurada."
            exit 1
          fi

          echo "OPENAI_API_KEY configurada."


      - name: Generate digest
        run: |
          python src/generate_digest.py


      - name: Generate HTML
        run: |
          python src/render_email.py


      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "output/digest.json",
              "output/digest.html",
              "output/last_prompt.txt",
          ]

          for file in required:
              if not Path(file).exists():
                  raise SystemExit(
                      f"Ficheiro em falta: {file}"
                  )

          data = json.loads(
              Path("output/digest.json")
              .read_text(encoding="utf-8")
          )

          topics = data.get("topics")

          if not isinstance(topics, list):
              raise SystemExit(
                  "digest.json sem topics"
              )

          if len(topics) != 5:
              raise SystemExit(
                  f"Esperados 5 temas, encontrados {len(topics)}"
              )

          print("=" * 70)
          print("DIGEST VALIDATION PASS")
          print("=" * 70)
          print(f"Topics: {len(topics)}")
          print("Editorial contract: OK")
          print("Production contract: OK")
          PY


      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-shorts-ai-output
          retention-days: 7
          path: |
            output/

name: Football Shorts AI - Inspect OpenAI Client

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:

  inspect-openai-client:

    name: Inspect OpenAI Client Contract

    runs-on: ubuntu-latest

    timeout-minutes: 10


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"



      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt



      - name: Compile project
        run: |
          python -m compileall src



      - name: Inspect OpenAI Client Functions
        run: |

          echo "=============================================="
          echo "OPENAI CLIENT FUNCTIONS"
          echo "=============================================="

          grep -n "^def " src/openai_client.py || true


          echo ""

          echo "=============================================="
          echo "OPENAI CLIENT CONTENT"
          echo "=============================================="

          sed -n '1,260p' src/openai_client.py



      - name: Stop after inspection
        run: |

          echo "=============================================="
          echo "INSPECTION COMPLETE"
          echo "Generate package disabled temporarily."
          echo "=============================================="

          exit 1

name: Football Shorts AI

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:

  football-shorts:
    name: Football Shorts AI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25


    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.5
      OPENAI_TIMEOUT_SECONDS: "120"
      OPENAI_MAX_RETRIES: "3"
      OPENAI_MAX_OUTPUT_TOKENS: "7000"
      PYTHONUNBUFFERED: "1"


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Compile Python project
        run: |
          python -m compileall src


      - name: Validate Editorial Contract
        run: |
          PYTHONPATH=src python src/editorial/test_parser.py


      - name: Inspect Editorial Prompt Builder
        run: |
          echo "=============================================="
          echo "PROMPT BUILDER FUNCTIONS"
          echo "=============================================="

          grep -n "^def " src/editorial/prompt_builder.py || true

          echo ""
          echo "=============================================="
          echo "PROMPT BUILDER CONTENT"
          echo "=============================================="

          sed -n '1,260p' src/editorial/prompt_builder.py


      - name: Validate OpenAI Secret
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY não configurada."
            exit 1
          fi

          echo "OPENAI_API_KEY configurada."


      - name: Generate News Digest
        run: |
          python src/generate_digest.py


      - name: Generate Editorial Package
        run: |
          PYTHONPATH=src python src/editorial/generate_package.py


      - name: Build Dashboard Model
        run: |
          PYTHONPATH=src python src/production/build_dashboard_model.py


      - name: Generate HTML Email
        run: |
          python src/render_email.py


      - name: Validate Pipeline Outputs
        run: |

          python - <<'PY'

          import json
          from pathlib import Path


          required_files = [

              "output/digest.json",
              "output/editorial_package.json",
              "output/dashboard_model.json",
              "output/digest.html",
              "output/last_prompt.txt",

          ]


          for file in required_files:

              if not Path(file).exists():

                  raise SystemExit(
                      f"Ficheiro em falta: {file}"
                  )


          digest = json.loads(
              Path(
                  "output/digest.json"
              )
              .read_text(
                  encoding="utf-8"
              )
          )


          editorial = json.loads(
              Path(
                  "output/editorial_package.json"
              )
              .read_text(
                  encoding="utf-8"
              )
          )


          dashboard = json.loads(
              Path(
                  "output/dashboard_model.json"
              )
              .read_text(
                  encoding="utf-8"
              )
          )


          if len(digest.get("topics", [])) != 5:

              raise SystemExit(
                  "Digest inválido."
              )


          if len(editorial.get("topics", [])) != 5:

              raise SystemExit(
                  "Editorial package inválido."
              )


          required_dashboard = {

              "generated_at",
              "channel",
              "top_title",
              "top_hook",
              "viral_probability",
              "metrics",
              "hooks",
              "storyboard",
              "ranking",

          }


          missing = (
              required_dashboard
              -
              dashboard.keys()
          )


          if missing:

              raise SystemExit(
                  f"Campos dashboard em falta: {missing}"
              )


          print("=" * 70)
          print("PIPELINE VALIDATION PASS")
          print("=" * 70)
          print(
              f"Digest: {len(digest['topics'])}"
          )
          print(
              f"Editorial: {len(editorial['topics'])}"
          )
          print(
              f"Dashboard: {dashboard['top_title']}"
          )

          PY


      - name: Upload Artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: football-shorts-ai-output

          retention-days: 7

          path: |
            output/

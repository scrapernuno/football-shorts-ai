name: Football Shorts AI Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  football-shorts:
    name: Football Shorts AI Pipeline

    runs-on: ubuntu-latest

    timeout-minutes: 25

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.5
      OPENAI_TIMEOUT_SECONDS: "120"
      OPENAI_MAX_RETRIES: "3"
      OPENAI_MAX_OUTPUT_TOKENS: "7000"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          ffmpeg -version
          ffprobe -version

      - name: Compile project
        run: |
          python -m compileall src

      - name: Validate Editorial Parser
        run: |
          PYTHONPATH=src \
          python src/editorial/test_parser.py

      - name: Validate OpenAI Secret
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY não configurada."
            exit 1
          fi

          echo "OPENAI_API_KEY configurada"

      - name: Generate News Digest
        run: |
          python src/generate_digest.py

      - name: Generate Editorial Package
        run: |
          PYTHONPATH=src \
          python src/editorial/generate_package.py

      - name: Build Dashboard Model
        run: |
          PYTHONPATH=src \
          python src/production/build_dashboard_model.py

      - name: Sync Dashboard Data
        run: |
          PYTHONPATH=src \
          python src/dashboard/sync_dashboard.py

      - name: Build Content Production Package
        run: |
          PYTHONPATH=src \
          python src/production/build_content_package.py

      - name: Compile Media Acquisition Architecture
        run: |
          python -m py_compile \
            src/assets/contracts.py \
            src/assets/provider_registry.py \
            src/assets/build_media_acquisition_plan.py \
            src/assets/sync_media_acquisition_plan.py \
            src/assets/certify_media_acquisition_governance.py \
            src/assets/providers/base.py \
            src/assets/providers/owned_library.py \
            src/assets/providers/imago.py \
            src/assets/providers/reuters_connect.py \
            src/assets/providers/tiktok_licensed_ugc.py \
            src/assets/providers/pexels.py

      - name: Build Media Acquisition Plan
        run: |
          PYTHONPATH=src \
          python src/assets/build_media_acquisition_plan.py

      - name: Compile TikTok Trend Intelligence
        run: |
          python -m py_compile \
            src/trends/build_trend_discovery_request.py \
            src/trends/discover_tiktok_trends.py \
            src/trends/build_tiktok_trend_intelligence.py \
            src/trends/build_platform_variants.py \
            src/trends/sync_trend_intelligence.py \
            src/trends/certify_tiktok_trend_governance.py \
            src/trends/providers/__init__.py \
            src/trends/providers/base.py \
            src/trends/providers/registry.py \
            src/trends/providers/openai_web_search.py \
            src/trends/providers/tiktok_business_discovery.py \
            src/trends/certify_tiktok_business_pre_activation.py

      - name: Certify TikTok Business Pre-Activation
        run: |
          PYTHONPATH=src \
          python src/trends/certify_tiktok_business_pre_activation.py

      - name: Build TikTok Trend Intelligence
        run: |
          PYTHONPATH=src \
          python src/trends/build_tiktok_trend_intelligence.py

      - name: Build Cross-Platform Variants
        run: |
          PYTHONPATH=src \
          python src/trends/build_platform_variants.py

      - name: Build Publishing Evidence
        run: |
          python -m py_compile \
            src/publishing/build_publishing_evidence.py

          PYTHONPATH=src \
          python src/publishing/build_publishing_evidence.py

          if [ ! -s output/publishing_evidence.json ]; then
            echo "::error::publishing_evidence.json não foi produzido."
            exit 1
          fi

          echo "PUBLISHING_EVIDENCE_HANDOVER=PASS"

      - name: Build Publishing Package
        run: |
          PYTHONPATH=src \
          python src/publishing/build_publishing_package.py

      - name: Refine Publishing Studio
        run: |
          python -m py_compile \
            src/publishing/refine_publishing_studio.py

          PYTHONPATH=src \
          python src/publishing/refine_publishing_studio.py

      - name: Build AI Production Preview
        env:
          OPENAI_TTS_MODEL: gpt-4o-mini-tts
          OPENAI_TTS_VOICE: marin
        run: |
          python -m py_compile \
            src/preview/build_production_preview.py \
            src/preview/sync_production_preview.py \
            src/preview/inject_production_preview_ui.py \
            src/preview/certify_production_preview.py

          PYTHONPATH=src \
          python src/preview/build_production_preview.py

      - name: Inject Production Preview UI
        run: |
          PYTHONPATH=src \
          python src/preview/inject_production_preview_ui.py

      - name: Sync Production Preview
        run: |
          PYTHONPATH=src \
          python src/preview/sync_production_preview.py

      - name: Build Analytics Package
        run: |
          PYTHONPATH=src \
          python src/analytics/build_analytics_package.py

      - name: Compile Production Studio Synchronizer
        run: |
          python -m py_compile \
            src/dashboard/sync_production_studio.py

      - name: Sync Production Studio Data
        run: |
          PYTHONPATH=src \
          python src/dashboard/sync_production_studio.py

      - name: Sync Media Acquisition Plan
        run: |
          PYTHONPATH=src \
          python src/assets/sync_media_acquisition_plan.py

      - name: Certify Media Acquisition Governance
        run: |
          PYTHONPATH=src \
          python src/assets/certify_media_acquisition_governance.py

      - name: Sync TikTok Trend Intelligence
        run: |
          PYTHONPATH=src \
          python src/trends/sync_trend_intelligence.py

      - name: Certify TikTok Trend Governance
        run: |
          PYTHONPATH=src \
          python src/trends/certify_tiktok_trend_governance.py

      - name: Certify Production Preview
        run: |
          PYTHONPATH=src \
          python src/preview/certify_production_preview.py

      - name: Validate Dashboard JavaScript
        run: |
          node --check dashboard/assets/dashboard.js

      - name: Generate HTML
        run: |
          python src/render_email.py

      - name: Prepare GitHub Pages
        run: |
          touch dashboard/.nojekyll

          echo "=============================================="
          echo "GITHUB PAGES CONTENT"
          echo "=============================================="

          find dashboard \
            -maxdepth 5 \
            -type f \
            -print \
            | sort

      - name: Validate Generated Outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path


          required_files = [
              "output/digest.json",
              "output/editorial_package.json",
              "output/dashboard_model.json",
              "output/content_package.json",
              "output/media_acquisition_plan.json",
              "output/trend_discovery_request.json",
              "output/tiktok_trend_discovery_results.json",
              "output/tiktok_trend_runtime_intake.json",
              "output/tiktok_trend_intelligence.json",
              "output/platform_variants.json",
              "output/publishing_evidence.json",
              "output/publishing_package.json",
              "output/production_preview.json",
              "output/assets/previews/production-preview.mp4",
              "output/assets/previews/production-preview.vtt",
              "output/assets/previews/production-preview-voice.mp3",
              "output/analytics_package.json",
              "output/digest.html",

              "dashboard/index.html",
              "dashboard/assets/dashboard.css",
              "dashboard/assets/dashboard.js",
              "dashboard/.nojekyll",

              "dashboard/data/dashboard_model.json",
              "dashboard/data/content_package.json",
              "dashboard/data/media_acquisition_plan.json",
              "dashboard/data/trend_discovery_request.json",
              "dashboard/data/tiktok_trend_discovery_results.json",
              "dashboard/data/tiktok_trend_intelligence.json",
              "dashboard/data/platform_variants.json",
              "dashboard/data/publishing_package.json",
              "dashboard/data/production_preview.json",
              "dashboard/assets/generated/production-preview.mp4",
              "dashboard/assets/generated/production-preview.vtt",
              "dashboard/data/analytics_package.json",
          ]


          allowed_empty_files = {
              "dashboard/.nojekyll",
          }


          for filename in required_files:
              path = Path(filename)

              if not path.is_file():
                  raise SystemExit(
                      f"Ficheiro em falta: {filename}"
                  )

              if (
                  path.stat().st_size <= 0
                  and filename not in allowed_empty_files
              ):
                  raise SystemExit(
                      f"Ficheiro vazio: {filename}"
                  )


          def load_json(filename: str) -> dict:
              path = Path(filename)

              try:
                  payload = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"JSON inválido em {filename}: {exc}"
                  ) from exc

              if not isinstance(payload, dict):
                  raise SystemExit(
                      f"{filename} deve conter um objeto JSON"
                  )

              return payload


          digest = load_json(
              "output/digest.json"
          )

          editorial = load_json(
              "output/editorial_package.json"
          )

          dashboard = load_json(
              "output/dashboard_model.json"
          )

          dashboard_public = load_json(
              "dashboard/data/dashboard_model.json"
          )

          content = load_json(
              "output/content_package.json"
          )

          content_public = load_json(
              "dashboard/data/content_package.json"
          )

          media_plan = load_json(
              "output/media_acquisition_plan.json"
          )

          media_plan_public = load_json(
              "dashboard/data/media_acquisition_plan.json"
          )

          trend_discovery_request = load_json(
              "output/trend_discovery_request.json"
          )

          trend_discovery_request_public = load_json(
              "dashboard/data/trend_discovery_request.json"
          )

          trend_discovery_results = load_json(
              "output/tiktok_trend_discovery_results.json"
          )

          trend_discovery_results_public = load_json(
              "dashboard/data/tiktok_trend_discovery_results.json"
          )

          trend_runtime_intake = load_json(
              "output/tiktok_trend_runtime_intake.json"
          )

          tiktok_trends = load_json(
              "output/tiktok_trend_intelligence.json"
          )

          tiktok_trends_public = load_json(
              "dashboard/data/tiktok_trend_intelligence.json"
          )

          platform_variants = load_json(
              "output/platform_variants.json"
          )

          platform_variants_public = load_json(
              "dashboard/data/platform_variants.json"
          )

          publishing_evidence = load_json(
              "output/publishing_evidence.json"
          )

          publishing = load_json(
              "output/publishing_package.json"
          )

          publishing_public = load_json(
              "dashboard/data/publishing_package.json"
          )

          production_preview = load_json(
              "output/production_preview.json"
          )

          production_preview_public = load_json(
              "dashboard/data/production_preview.json"
          )

          analytics = load_json(
              "output/analytics_package.json"
          )

          analytics_public = load_json(
              "dashboard/data/analytics_package.json"
          )


          if len(digest.get("topics", [])) != 5:
              raise SystemExit(
                  "Digest inválido"
              )


          if len(editorial.get("topics", [])) != 5:
              raise SystemExit(
                  "Editorial package inválido"
              )


          required_dashboard = {
              "generated_at",
              "channel",
              "top_title",
              "top_hook",
              "viral_probability",
              "metrics",
              "hooks",
              "storyboard",
              "ranking",
          }


          missing_dashboard = (
              required_dashboard
              - dashboard.keys()
          )


          if missing_dashboard:
              raise SystemExit(
                  "Dashboard incompleta: "
                  f"{sorted(missing_dashboard)}"
              )


          missing_public_dashboard = (
              required_dashboard
              - dashboard_public.keys()
          )


          if missing_public_dashboard:
              raise SystemExit(
                  "Dashboard pública incompleta: "
                  f"{sorted(missing_public_dashboard)}"
              )


          if (
              dashboard_public.get("top_title")
              != dashboard.get("top_title")
          ):
              raise SystemExit(
                  "Dashboard pública não corresponde "
                  "ao modelo produzido"
              )


          ranking = dashboard.get(
              "ranking"
          )


          if not isinstance(ranking, list) or not ranking:
              raise SystemExit(
                  "Dashboard ranking inválido"
              )


          required_content = {
              "package_version",
              "generated_at",
              "source_topic",
              "script",
              "voiceover",
              "scenes",
              "captions",
              "assets",
              "publishing",
          }


          missing_content = (
              required_content
              - content.keys()
          )


          if missing_content:
              raise SystemExit(
                  "Content package incompleto: "
                  f"{sorted(missing_content)}"
              )


          missing_public_content = (
              required_content
              - content_public.keys()
          )


          if missing_public_content:
              raise SystemExit(
                  "Content package público incompleto: "
                  f"{sorted(missing_public_content)}"
              )


          source_topic = content.get(
              "source_topic"
          )


          if not isinstance(source_topic, dict):
              raise SystemExit(
                  "Content source_topic inválido"
              )


          if source_topic.get("priority") != 1:
              raise SystemExit(
                  "Content package não usa "
                  "winner priority 1"
              )


          public_source_topic = content_public.get(
              "source_topic"
          )


          if not isinstance(public_source_topic, dict):
              raise SystemExit(
                  "Content público source_topic inválido"
              )


          if (
              public_source_topic.get("title")
              != source_topic.get("title")
          ):
              raise SystemExit(
                  "Content package público não corresponde "
                  "ao package produzido"
              )


          script = content.get(
              "script"
          )


          if not isinstance(script, dict):
              raise SystemExit(
                  "Content script inválido"
              )


          required_script = {
              "hook",
              "introduction",
              "development",
              "climax",
              "ending",
              "call_to_action",
          }


          missing_script = (
              required_script
              - script.keys()
          )


          if missing_script:
              raise SystemExit(
                  "Content script incompleto: "
                  f"{sorted(missing_script)}"
              )


          scenes = content.get(
              "scenes"
          )


          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "Content package sem cenas"
              )


          expected_scene_numbers = list(
              range(
                  1,
                  len(scenes) + 1,
              )
          )


          observed_scene_numbers = [
              scene.get("scene_number")
              for scene in scenes
              if isinstance(scene, dict)
          ]


          if (
              observed_scene_numbers
              != expected_scene_numbers
          ):
              raise SystemExit(
                  "Content scenes não são sequenciais"
              )


          for index, scene in enumerate(scenes):
              if not isinstance(scene, dict):
                  raise SystemExit(
                      f"Scene inválida no índice {index}"
                  )

              duration = scene.get(
                  "duration_seconds"
              )

              if (
                  not isinstance(duration, int)
                  or isinstance(duration, bool)
                  or duration <= 0
              ):
                  raise SystemExit(
                      "Scene com duration_seconds inválido "
                      f"no índice {index}"
                  )


          if media_plan != media_plan_public:
              raise SystemExit(
                  "Media Acquisition Plan público "
                  "não corresponde ao plano produzido"
              )


          if (
              media_plan.get("publication_execution_enabled")
              is not False
          ):
              raise SystemExit(
                  "Media Acquisition Plan ativou publicação"
              )


          media_policy = media_plan.get(
              "policy"
          )


          if (
              not isinstance(media_policy, dict)
              or media_policy.get("mode")
              != "copyright_aware_fail_closed"
              or media_policy.get("unlicensed_media_allowed")
              is not False
              or media_policy.get(
                  "editorial_exception_requires_manual_review"
              )
              is not True
          ):
              raise SystemExit(
                  "Media Acquisition Plan viola "
                  "a política de copyright"
              )


          provider_ids = [
              provider.get("provider_id")
              for provider in media_plan.get(
                  "provider_registry",
                  [],
              )
              if isinstance(provider, dict)
          ]


          if provider_ids != [
              "owned_library",
              "imago",
              "reuters_connect",
              "tiktok_licensed_ugc",
              "pexels",
          ]:
              raise SystemExit(
                  "Media provider order inválida"
              )


          scene_plans = media_plan.get(
              "scene_plans"
          )


          if (
              not isinstance(scene_plans, list)
              or len(scene_plans) != len(scenes)
          ):
              raise SystemExit(
                  "Media Acquisition Plan não cobre "
                  "todas as cenas"
              )


          for scene_plan in scene_plans:
              if not isinstance(scene_plan, dict):
                  raise SystemExit(
                      "Scene plan inválido"
                  )

              if scene_plan.get("selected_asset") is not None:
                  raise SystemExit(
                      "Asset selecionado antes da ativação"
                  )

              if scene_plan.get("rights_status") != "unresolved":
                  raise SystemExit(
                      "Direitos resolvidos sem evidência"
                  )

              if (
                  scene_plan.get("subject_scope")
                  ==
                  "specific_football"
              ):
                  pexels_routes = [
                      route
                      for route in scene_plan.get(
                          "provider_route",
                          [],
                      )
                      if (
                          isinstance(route, dict)
                          and
                          route.get("provider_id")
                          ==
                          "pexels"
                      )
                  ]

                  if (
                      len(pexels_routes) != 1
                      or
                      pexels_routes[0].get("allowed")
                      is not False
                  ):
                      raise SystemExit(
                          "Pexels permitido para "
                          "conteúdo específico"
                      )


          if (
              trend_discovery_request
              != trend_discovery_request_public
          ):
              raise SystemExit(
                  "Trend Discovery Request público "
                  "não corresponde ao output"
              )


          if (
              trend_discovery_request.get("source_mode")
              != "automatic_winning_topic_binding"
          ):
              raise SystemExit(
                  "Trend Discovery Request sem "
                  "binding automático"
              )


          discovery_binding = trend_discovery_request.get(
              "topic_binding"
          )


          if not isinstance(discovery_binding, dict):
              raise SystemExit(
                  "Trend Discovery topic_binding inválido"
              )


          if (
              discovery_binding.get("content_title")
              != source_topic.get("title")
              or discovery_binding.get("content_hook")
              != source_topic.get("hook")
          ):
              raise SystemExit(
                  "Trend Discovery Request não corresponde "
                  "à notícia vencedora"
              )


          discovery_identity = discovery_binding.get(
              "content_identity_sha256"
          )


          if (
              not isinstance(discovery_identity, str)
              or len(discovery_identity) != 64
          ):
              raise SystemExit(
                  "Trend Discovery content identity inválida"
              )


          discovery_queries = trend_discovery_request.get(
              "search_queries"
          )


          if (
              not isinstance(discovery_queries, list)
              or not discovery_queries
              or any(
                  not isinstance(query, str)
                  or not query.strip()
                  for query in discovery_queries
              )
          ):
              raise SystemExit(
                  "Trend Discovery search queries inválidas"
              )


          requested_assets = trend_discovery_request.get(
              "requested_assets"
          )


          if requested_assets != [
              "trend_video_reference",
              "trend_sound_reference",
              "hashtag_reference",
          ]:
              raise SystemExit(
                  "Trend Discovery assets solicitados inválidos"
              )


          discovery_intake = trend_discovery_request.get(
              "candidate_intake"
          )


          if (
              not isinstance(discovery_intake, dict)
              or discovery_intake.get(
                  "automatic_candidate_selection"
              )
              is not False
              or discovery_intake.get(
                  "rights_evidence_required"
              )
              is not True
          ):
              raise SystemExit(
                  "Trend Discovery candidate intake inválido"
              )


          discovery_boundaries = trend_discovery_request.get(
              "capability_boundaries"
          )


          if (
              not isinstance(discovery_boundaries, dict)
              or discovery_boundaries.get(
                  "network_execution_enabled"
              )
              is not True
              or discovery_boundaries.get(
                  "network_execution_scope"
              )
              != "github_actions_server_side_web_search"
              or discovery_boundaries.get(
                  "web_search_provider"
              )
              != "openai_web_search"
              or discovery_boundaries.get(
                  "browser_api_calls_enabled"
              )
              is not False
              or discovery_boundaries.get(
                  "direct_tiktok_api_calls_enabled"
              )
              is not False
              or discovery_boundaries.get(
                  "third_party_download_allowed"
              )
              is not False
              or discovery_boundaries.get(
                  "watermark_removal_allowed"
              )
              is not False
          ):
              raise SystemExit(
                  "Trend Discovery capability boundary inválida"
              )


          if (
              trend_discovery_request.get("status")
              != "discovery_required"
              or trend_discovery_request.get(
                  "publication_execution_enabled"
              )
              is not False
          ):
              raise SystemExit(
                  "Trend Discovery lifecycle inválido"
              )


          if (
              trend_discovery_results
              != trend_discovery_results_public
          ):
              raise SystemExit(
                  "Trend Discovery Results públicos "
                  "não correspondem ao output"
              )


          results_binding = trend_discovery_results.get(
              "topic_binding"
          )


          results_execution = trend_discovery_results.get(
              "execution"
          )


          results_governance = trend_discovery_results.get(
              "governance"
          )


          if (
              not isinstance(results_binding, dict)
              or results_binding.get(
                  "content_identity_sha256"
              )
              != discovery_identity
          ):
              raise SystemExit(
                  "Trend Discovery Results sem binding válido"
              )


          if (
              not isinstance(results_execution, dict)
              or results_execution.get(
                  "server_side_network_execution_enabled"
              )
              is not True
              or results_execution.get(
                  "browser_api_calls_enabled"
              )
              is not False
              or results_execution.get(
                  "direct_tiktok_api_calls_enabled"
              )
              is not False
              or results_execution.get(
                  "automatic_candidate_selection_enabled"
              )
              is not False
          ):
              raise SystemExit(
                  "Trend Discovery execution boundary inválida"
              )


          if (
              not isinstance(results_governance, dict)
              or results_governance.get(
                  "third_party_download_allowed"
              )
              is not False
              or results_governance.get(
                  "watermark_removal_allowed"
              )
              is not False
              or results_governance.get(
                  "publication_execution_enabled"
              )
              is not False
          ):
              raise SystemExit(
                  "Trend Discovery results governance inválida"
              )


          runtime_binding = trend_runtime_intake.get(
              "topic_binding"
          )


          if (
              not isinstance(runtime_binding, dict)
              or runtime_binding.get(
                  "content_identity_sha256"
              )
              != discovery_identity
              or trend_runtime_intake.get(
                  "selected_video_candidate_id"
              )
              is not None
              and not isinstance(
                  trend_runtime_intake.get(
                      "selected_video_candidate_id"
                  ),
                  str,
              )
          ):
              raise SystemExit(
                  "Trend runtime intake inválido"
              )



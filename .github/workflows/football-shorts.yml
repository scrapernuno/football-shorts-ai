      - name: Upload Pipeline Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-shorts-ai-output
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/
            dashboard/
            docs/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard/

  deploy-pages:
    name: Deploy GitHub Pages

    needs:
      - football-shorts

    if: ${{ needs.football-shorts.result == 'success' }}

    runs-on: ubuntu-latest

    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

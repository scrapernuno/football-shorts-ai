name: Controlled Render Execution Gate Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/factory/controlled_render_authorization.py'
      - 'src/factory/controlled_ffmpeg_render_execution.py'
      - 'tests/factory/test_controlled_render_authorization.py'
      - 'tests/factory/test_controlled_ffmpeg_render_execution.py'
      - '.github/workflows/controlled-render-execution-gate-certification.yml'
  pull_request:
    paths:
      - 'src/factory/controlled_render_authorization.py'
      - 'src/factory/controlled_ffmpeg_render_execution.py'
      - 'tests/factory/test_controlled_render_authorization.py'
      - 'tests/factory/test_controlled_ffmpeg_render_execution.py'

permissions:
  contents: read

jobs:
  certify-0061a-0061b:
    name: Certify Controlled Render Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Compile controlled render modules
        run: |
          python -m py_compile \
            src/factory/controlled_render_authorization.py \
            src/factory/controlled_ffmpeg_render_execution.py

      - name: Run focused certification tests
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/factory/test_controlled_render_authorization.py \
            tests/factory/test_controlled_ffmpeg_render_execution.py \
            | tee controlled-render-gate-certification.txt

      - name: Assert no real render command exists in workflow
        run: |
          set -euo pipefail
          ! grep -E '(^|[[:space:]])ffmpeg[[:space:]].*(-i|-filter_complex)' \
            .github/workflows/controlled-render-execution-gate-certification.yml
          grep -F 'execute=False' tests/factory/test_controlled_ffmpeg_render_execution.py

      - name: Record disabled capabilities
        run: |
          cat >> controlled-render-gate-certification.txt <<'EOF'
          CONTROLLED_RENDER_GATE=CERTIFIED
          NETWORK_ENABLED=DISABLED
          ACQUISITION_ENABLED=DISABLED
          AUTO_PUBLISH=DISABLED
          REAL_FFMPEG_EXECUTION=NOT_PERFORMED
          EOF

      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: controlled-render-gate-certification
          path: controlled-render-gate-certification.txt
          retention-days: 30
          if-no-files-found: error

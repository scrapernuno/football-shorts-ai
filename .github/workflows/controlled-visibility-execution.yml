name: Controlled YouTube Visibility Execution

on:
  workflow_dispatch:
    inputs:
      decision_json:
        description: Path to the approved 0061J visibility decision JSON
        required: true
        default: dashboard/data/youtube_visibility_decision.json
        type: string
      execution_confirmation:
        description: Type exactly EXECUTE AUTHORIZED VISIBILITY CHANGE ONCE
        required: true
        type: string
      prepare_only:
        description: Validate and certify without accessing YouTube
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: controlled-youtube-visibility-execution
  cancel-in-progress: false

jobs:
  controlled-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      DECISION_JSON: ${{ inputs.decision_json }}
      EXECUTION_CONFIRMATION: ${{ inputs.execution_confirmation }}
      PREPARE_ONLY: ${{ inputs.prepare_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Certify 0061J through 0062B
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/publishing/test_controlled_visibility_final_publication.py \
            tests/publishing/test_controlled_visibility_execution.py \
            tests/publishing/test_youtube_visibility_oauth_adapter.py

      - name: Validate controlled decision
        run: |
          set -euo pipefail
          test -f "$DECISION_JSON" || {
            echo "Visibility decision not found: $DECISION_JSON" >&2
            exit 1
          }
          python - <<'PY'
          import json, os
          from pathlib import Path
          decision = json.loads(Path(os.environ['DECISION_JSON']).read_text(encoding='utf-8'))
          required = {
              'decision_state': 'ready_for_manual_publication',
              'manual_publication_allowed': True,
              'confirmation_phrase': 'APPLY AUTHORIZED YOUTUBE VISIBILITY ONCE',
          }
          for key, value in required.items():
              if decision.get(key) != value:
                  raise SystemExit(f'visibility decision failed: {key}')
          if os.environ['EXECUTION_CONFIRMATION'] != 'EXECUTE AUTHORIZED VISIBILITY CHANGE ONCE':
              raise SystemExit('second human confirmation is invalid')
          Path('artifacts/visibility').mkdir(parents=True, exist_ok=True)
          Path('artifacts/visibility/validated_visibility_decision.json').write_text(
              json.dumps(decision, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print('VISIBILITY_DECISION=VALIDATED')
          print('SECOND_HUMAN_CONFIRMATION=VALIDATED')
          PY

      - name: Prepare-only boundary
        if: ${{ inputs.prepare_only }}
        run: |
          set -euo pipefail
          echo "PREPARE_ONLY=TRUE"
          echo "OAUTH_SECRETS_READ=FALSE"
          echo "NETWORK_USED=FALSE"
          echo "VISIBILITY_CHANGE_EXECUTED=FALSE"
          echo "AUTO_PUBLISH=FALSE"

      - name: Execute one authorized visibility change
        if: ${{ !inputs.prepare_only }}
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_OAUTH_CLIENT_ID"
          test -n "$YOUTUBE_OAUTH_CLIENT_SECRET"
          test -n "$YOUTUBE_OAUTH_REFRESH_TOKEN"
          python -m publishing.run_controlled_visibility_execution \
            --decision "$DECISION_JSON" \
            --confirmation "$EXECUTION_CONFIRMATION" \
            --output artifacts/visibility/visibility_execution_result.json

      - name: Upload controlled evidence
        uses: actions/upload-artifact@v4
        with:
          name: controlled-visibility-execution-${{ github.run_id }}
          path: artifacts/visibility/
          if-no-files-found: error
          retention-days: 30

name: Video Factory Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/factory/**'
      - 'tests/factory/**'
      - 'tests/dashboard/**'
      - 'dashboard/video-preview.html'
      - 'dashboard/thumbnail-preview.html'
      - 'dashboard/assets/video-*.js'
      - 'dashboard/assets/multi-clip-timeline-composer.js'
      - 'dashboard/data/video_factory_*.json'
      - '.github/workflows/video-factory-certification.yml'
  pull_request:
    paths:
      - 'src/factory/**'
      - 'tests/factory/**'
      - 'tests/dashboard/**'
      - 'dashboard/**'

permissions:
  contents: read

jobs:
  certify-video-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest

      - name: Compile Video Factory sources
        run: python -m compileall -q src/factory tests/factory tests/dashboard

      - name: Run Video Factory tests
        run: |
          python -m pytest -q tests/factory tests/dashboard \
            --ignore=tests/dashboard/test_ai_director_review_studio.py \
            --ignore=tests/dashboard/test_ai_director_dashboard_live_integration.py

      - name: Run 0060J final certification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/certification
          python src/factory/certify_video_factory.py | tee artifacts/certification/video_factory_0060j.txt
          grep -Fx 'CERTIFIED' artifacts/certification/video_factory_0060j.txt
          grep -Fx 'NETWORK_ENABLED=DISABLED' artifacts/certification/video_factory_0060j.txt
          grep -Fx 'ACQUISITION_ENABLED=DISABLED' artifacts/certification/video_factory_0060j.txt
          grep -Fx 'EXTRACTION_ENABLED=DISABLED' artifacts/certification/video_factory_0060j.txt
          grep -Fx 'RENDER_ENABLED=DISABLED' artifacts/certification/video_factory_0060j.txt
          grep -Fx 'FFMPEG_EXECUTION_ENABLED=DISABLED' artifacts/certification/video_factory_0060j.txt
          grep -Fx 'AUTO_PUBLISH=DISABLED' artifacts/certification/video_factory_0060j.txt

      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: video-factory-0060j-certification
          path: artifacts/certification/video_factory_0060j.txt
          retention-days: 30
          if-no-files-found: error

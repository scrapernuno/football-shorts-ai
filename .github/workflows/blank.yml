name: Football Shorts AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  football-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.5
      OPENAI_TIMEOUT_SECONDS: "120"
      OPENAI_MAX_RETRIES: "3"
      OPENAI_MAX_OUTPUT_TOKENS: "7000"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar todo o projeto
        run: |
          python -m compileall src

      - name: Testar Parser Editorial
        run: |
          PYTHONPATH=src python src/editorial/test_parser.py

      - name: Validar OPENAI_API_KEY
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY não configurada."
            exit 1
          fi

      - name: Gerar Digest
        run: |
          python src/generate_digest.py

      - name: Gerar HTML
        run: |
          python src/render_email.py

      - name: Validar Outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          digest = Path("output/digest.json")
          html = Path("output/digest.html")
          prompt = Path("output/last_prompt.txt")

          assert digest.exists(), "digest.json não encontrado"
          assert html.exists(), "digest.html não encontrado"
          assert prompt.exists(), "last_prompt.txt não encontrado"

          data = json.loads(digest.read_text(encoding="utf-8"))

          assert "topics" in data
          assert len(data["topics"]) == 5

          print("=" * 70)
          print("DIGEST VALIDADO")
          print("=" * 70)
          print(f"Temas: {len(data['topics'])}")
          print(f"HTML: {html.stat().st_size} bytes")
          print(f"Prompt: {prompt.stat().st_size} bytes")
          PY

      - name: Publicar Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: football-shorts-output
          retention-days: 7
          path: |
            output/

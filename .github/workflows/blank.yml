name: Football Shorts AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-digest:
    name: Gerar digest com GPT-5.5
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.5
      OPENAI_TIMEOUT_SECONDS: "120"
      OPENAI_MAX_RETRIES: "3"
      OPENAI_MAX_OUTPUT_TOKENS: "7000"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar estrutura Python
        run: |
          python -m py_compile \
            src/collect_news.py \
            src/score_news.py \
            src/select_topics.py \
            src/build_prompt.py \
            src/openai_client.py \
            src/generate_digest.py

      - name: Confirmar segredo OpenAI
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::O segredo OPENAI_API_KEY não está configurado."
            exit 1
          fi

          echo "OPENAI_API_KEY está configurado."

      - name: Gerar digest com GPT-5.5
        run: |
          python src/generate_digest.py

      - name: Validar digest produzido
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/digest.json")

          if not path.is_file():
              raise SystemExit("output/digest.json não foi criado.")

          payload = json.loads(path.read_text(encoding="utf-8"))
          topics = payload.get("topics")

          if not isinstance(topics, list):
              raise SystemExit("O campo topics não é uma lista.")

          if len(topics) != 5:
              raise SystemExit(
                  f"Esperados 5 temas; encontrados {len(topics)}."
              )

          print("Digest JSON validado.")
          print(f"Temas: {len(topics)}")
          PY

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-shorts-digest
          path: |
            output/digest.json
            output/last_prompt.txt
          if-no-files-found: warn
          retention-days: 7

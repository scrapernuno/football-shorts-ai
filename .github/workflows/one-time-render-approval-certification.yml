name: One-Time Render Approval Certification

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/factory/one_time_render_approval.py'
      - 'tests/factory/test_one_time_render_approval.py'
      - '.github/workflows/one-time-render-approval-certification.yml'
  pull_request:
    paths:
      - 'src/factory/one_time_render_approval.py'
      - 'tests/factory/test_one_time_render_approval.py'

permissions:
  contents: read

jobs:
  certify-0061d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile contract
        run: python -m py_compile src/factory/one_time_render_approval.py
      - name: Run focused certification
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/factory/test_one_time_render_approval.py
      - name: Emit safety evidence
        run: |
          {
            echo 'ONE_TIME_RENDER_APPROVAL=CERTIFIED'
            echo 'SINGLE_USE=ENFORCED'
            echo 'EXPIRATION=ENFORCED'
            echo 'FFMPEG_EXECUTION_ENABLED=DISABLED'
            echo 'AUTO_PUBLISH=DISABLED'
            echo 'REAL_RENDER=NOT_PERFORMED'
          } | tee one-time-render-approval-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: one-time-render-approval-evidence
          path: one-time-render-approval-evidence.txt
          retention-days: 30

name: Governed Media Acquisition Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "src/assets/media_acquisition_runtime.py"
      - "src/assets/controlled_provider_discovery.py"
      - "src/assets/materialize_selected_media.py"
      - "src/assets/orchestrate_media_acquisition.py"
      - "tests/assets/test_media_acquisition_runtime.py"
      - "tests/assets/test_controlled_provider_discovery.py"
      - "tests/assets/test_materialize_selected_media.py"
      - "tests/assets/test_orchestrate_media_acquisition.py"
      - ".github/workflows/media-acquisition-runtime.yml"
  pull_request:
    paths:
      - "src/assets/media_acquisition_runtime.py"
      - "src/assets/controlled_provider_discovery.py"
      - "src/assets/materialize_selected_media.py"
      - "src/assets/orchestrate_media_acquisition.py"
      - "tests/assets/test_media_acquisition_runtime.py"
      - "tests/assets/test_controlled_provider_discovery.py"
      - "tests/assets/test_materialize_selected_media.py"
      - "tests/assets/test_orchestrate_media_acquisition.py"
      - ".github/workflows/media-acquisition-runtime.yml"

permissions:
  contents: read

concurrency:
  group: governed-media-acquisition-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify-media-acquisition-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Configure PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> "$GITHUB_ENV"

      - name: Compile governed acquisition authorities
        run: |
          set -euo pipefail
          python -m py_compile \
            src/assets/contracts.py \
            src/assets/build_media_acquisition_plan.py \
            src/assets/media_acquisition_runtime.py \
            src/assets/controlled_provider_discovery.py \
            src/assets/materialize_selected_media.py \
            src/assets/orchestrate_media_acquisition.py \
            tests/assets/test_media_acquisition_runtime.py \
            tests/assets/test_controlled_provider_discovery.py \
            tests/assets/test_materialize_selected_media.py \
            tests/assets/test_orchestrate_media_acquisition.py

      - name: Run governed acquisition orchestration certification
        run: |
          set -euo pipefail
          pytest -q \
            tests/assets/test_media_acquisition_runtime.py \
            tests/assets/test_controlled_provider_discovery.py \
            tests/assets/test_materialize_selected_media.py \
            tests/assets/test_orchestrate_media_acquisition.py

      - name: Emit certification summary
        run: |
          {
            echo "## FOOTBALL-SHORTS-AI-0048D"
            echo
            echo "- Acquisition plan generation: PASS"
            echo "- Controlled provider discovery: PASS"
            echo "- Rights-aware deterministic ranking: PASS"
            echo "- Selected asset materialization: PASS"
            echo "- MIME and media signature validation: PASS"
            echo "- SHA-256 evidence binding: PASS"
            echo "- Atomic plan, manifest and asset persistence: PASS"
            echo "- Stale output removal: PASS"
            echo "- Blocked-scene delivery prevention: PASS"
            echo "- End-to-end orchestration: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

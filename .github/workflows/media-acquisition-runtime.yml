name: Governed Media Acquisition Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "src/assets/media_acquisition_runtime.py"
      - "src/assets/controlled_provider_discovery.py"
      - "src/assets/materialize_selected_media.py"
      - "tests/assets/test_media_acquisition_runtime.py"
      - "tests/assets/test_controlled_provider_discovery.py"
      - "tests/assets/test_materialize_selected_media.py"
      - ".github/workflows/media-acquisition-runtime.yml"
  pull_request:
    paths:
      - "src/assets/media_acquisition_runtime.py"
      - "src/assets/controlled_provider_discovery.py"
      - "src/assets/materialize_selected_media.py"
      - "tests/assets/test_media_acquisition_runtime.py"
      - "tests/assets/test_controlled_provider_discovery.py"
      - "tests/assets/test_materialize_selected_media.py"
      - ".github/workflows/media-acquisition-runtime.yml"

permissions:
  contents: read

concurrency:
  group: governed-media-acquisition-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify-media-acquisition-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Configure PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> "$GITHUB_ENV"

      - name: Compile governed runtime discovery and delivery authorities
        run: |
          set -euo pipefail
          python -m py_compile \
            src/assets/contracts.py \
            src/assets/media_acquisition_runtime.py \
            src/assets/controlled_provider_discovery.py \
            src/assets/materialize_selected_media.py \
            tests/assets/test_media_acquisition_runtime.py \
            tests/assets/test_controlled_provider_discovery.py \
            tests/assets/test_materialize_selected_media.py

      - name: Run governed acquisition and delivery certification
        run: |
          set -euo pipefail
          pytest -q \
            tests/assets/test_media_acquisition_runtime.py \
            tests/assets/test_controlled_provider_discovery.py \
            tests/assets/test_materialize_selected_media.py

      - name: Emit certification summary
        run: |
          {
            echo "## FOOTBALL-SHORTS-AI-0048C"
            echo
            echo "- Media Acquisition Runtime: PASS"
            echo "- Owned-library discovery adapter: PASS"
            echo "- Pexels controlled discovery adapter: PASS"
            echo "- Rights-aware selection: PASS"
            echo "- Selected asset materialization: PASS"
            echo "- HTTPS and local-file delivery gate: PASS"
            echo "- MIME and media signature validation: PASS"
            echo "- Maximum asset size enforcement: PASS"
            echo "- SHA-256 evidence binding: PASS"
            echo "- Atomic asset and manifest persistence: PASS"
            echo "- Watermark and cross-platform rights gates: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

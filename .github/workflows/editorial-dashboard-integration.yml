name: Editorial Dashboard Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-dashboard-integration.yml'
      - 'dashboard/assets/dashboard-editorial-integration.js'
      - 'dashboard/data/editorial_review_package.json'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('dashboard/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="assets/dashboard-editorial-integration.js"></script>'
          if marker not in text:
              anchor = '<script src="assets/dashboard.js"></script>'
              if anchor not in text:
                  raise SystemExit('dashboard.js script anchor not found')
              text = text.replace(anchor, anchor + '\n    ' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate integration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'assets/dashboard-editorial-integration.js' dashboard/index.html
          grep -Fq 'Editorial Review' dashboard/assets/dashboard-editorial-integration.js
          test -s dashboard/data/editorial_review_package.json
          python -m json.tool dashboard/data/editorial_review_package.json >/dev/null

      - name: Commit integration when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dashboard/index.html; then
            echo 'Dashboard entrypoint already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/index.html
          git commit -m 'feat(0056K): expose editorial review in dashboard'
          git push
